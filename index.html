<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aprende Palabras Mágicas</title>
  
  <!-- Fuentes divertidas y librería de confeti -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra Superior */
    .header {
      background: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
    }

    .btn-cute {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }
    .btn-cute:active { transform: translateY(4px); box-shadow: none; }
    
    .btn-sound { background: #ffeaa7; color: #d35400; }
    .btn-teacher { background: #a29bfe; color: #ffffff; }
    
    .counter {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      color: #2d3436;
      font-weight: 700;
    }

    /* Área Principal */
    .board {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .nav-buttons {
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .btn-nav {
      background: #74b9ff;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 15px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 0 #0984e3;
    }
    .btn-nav:active { transform: translateY(4px); box-shadow: none; }

    /* Marco de Imagen */
    .image-frame {
      width: 100%;
      height: 200px;
      border: 4px dashed #74b9ff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fbff;
      position: relative;
    }
    
    .image-frame img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 12px;
    }

    .placeholder-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.5rem;
      color: #b2bec3;
    }

    .instruction {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem;
      color: #2d3436;
      text-align: center;
    }

    /* Casillas */
    .slots-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    .slot-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .letter-slot {
      width: 65px;
      height: 75px;
      background: #ffffff;
      border: 3px solid #dfe6e9;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 2.5rem;
      color: #2d3436;
      box-shadow: 0 6px 0 #dfe6e9;
      cursor: pointer;
      transition: all 0.2s;
    }

    .letter-slot.active {
      border-color: #fdcb6e;
      background: #fff9e6;
      box-shadow: 0 6px 0 #e1b12c;
      transform: translateY(-2px);
    }

    .btn-listen {
      background: #00cec9;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 #00b894;
    }
    .btn-listen:active { transform: translateY(3px); box-shadow: none; }

    /* Acciones Generales */
    .main-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      border: none;
      padding: 12px 5px;
      border-radius: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: white;
      cursor: pointer;
    }
    .btn-spell { background: #74b9ff; box-shadow: 0 5px 0 #0984e3; }
    .btn-say-all { background: #55efc4; color: #2d3436; box-shadow: 0 5px 0 #00b894; }
    .btn-clear { background: #ff7675; box-shadow: 0 5px 0 #d63031; }
    .btn-action:active { transform: translateY(5px); box-shadow: none; }

    /* Resultado */
    .result-box {
      width: 100%;
      background: #ffeaa7;
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      border: 3px solid #fdcb6e;
    }

    .result-title {
      font-weight: 900;
      color: #d35400;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    .result-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: #e17055;
      letter-spacing: 0.2em;
      min-height: 40px;
    }

    /* Teclado */
    .keyboard {
      background: #f1f2f6;
      padding: 20px 10px;
      border-top: 3px solid #dfe6e9;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 10px;
    }

    .kb-header span {
      font-family: 'Fredoka', sans-serif;
      color: #636e72;
      font-size: 1.1rem;
    }

    .btn-backspace {
      background: #ff7675;
      color: white;
      border: none;
      padding: 6px 15px;
      border-radius: 12px;
      font-family: 'Fredoka', sans-serif;
      box-shadow: 0 4px 0 #d63031;
      cursor: pointer;
    }
    .btn-backspace:active { transform: translateY(4px); box-shadow: none; }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .key-btn {
      width: 38px;
      height: 48px;
      background: white;
      border: 2px solid #dfe6e9;
      border-radius: 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem;
      color: #2d3436;
      box-shadow: 0 4px 0 #dfe6e9;
      cursor: pointer;
    }
    .key-btn:active { transform: translateY(4px); box-shadow: none; background: #f1f2f6; }

    /* Modal Docente */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(45, 52, 54, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 30px;
      padding: 25px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-family: 'Fredoka', sans-serif;
      color: #6c5ce7;
    }

    .btn-close {
      background: #dfe6e9;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #2d3436;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: 800;
      color: #2d3436;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #dfe6e9;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
    }

    .btn-save {
      width: 100%;
      background: #00cec9;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #00b894;
      margin-top: 10px;
    }
    .btn-save:active { transform: translateY(5px); box-shadow: none; }

    .word-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fbff;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      border: 2px solid #74b9ff;
    }
    
    .btn-delete {
      background: #ff7675;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <button id="btnSound" class="btn-cute btn-sound">Sonido: ON</button>
      <span id="counter" class="counter">1 / 1</span>
      <button id="btnTeacher" class="btn-cute btn-teacher">Docente 👩‍🏫</button>
    </header>

    <main class="board">
      <div class="nav-buttons">
        <button id="btnPrev" class="btn-nav">◀ Anterior</button>
        <button id="btnNext" class="btn-nav">Siguiente ▶</button>
      </div>

      <div class="image-frame">
        <div id="boxPlaceholder" class="placeholder-text">CASA</div>
        <img id="boxImg" style="display: none;" alt="Ilustración">
      </div>

      <h2 id="taskInstruction" class="instruction">Forma una palabra de cuatro letras</h2>

      <div class="slots-container" id="slotsContainer"></div>

      <div class="main-actions">
        <button id="btnSpell" class="btn-action btn-spell">👂 Deletrear</button>
        <button id="btnSpeak" class="btn-action btn-say-all">🎉 Escuchar todo</button>
        <button id="btnClear" class="btn-action btn-clear">🗑️ Borrar</button>
      </div>

      <div class="result-box">
        <div class="result-title">Palabra Formada</div>
        <div id="formedText" class="result-text"></div>
      </div>
    </main>

    <section class="keyboard">
      <div class="kb-header">
        <span>Teclado Mágico ✨</span>
        <button id="btnBackspace" class="btn-backspace">⌫ Borrar</button>
      </div>
      <div id="keyboardRows"></div>
    </section>
  </div>

  <div id="teacherModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Panel del Docente</h2>
        <button id="btnCloseModal" class="btn-close">&times;</button>
      </div>
      
      <form id="addWordForm">
        <div class="form-group">
          <label>Palabra (Ej. SILLA):</label>
          <input type="text" id="inpWord" maxlength="10" required>
        </div>
        <div class="form-group">
          <label>Consigna para el alumno:</label>
          <input type="text" id="inpInstruction" required>
        </div>
        <div class="form-group">
          <label>Subir Fotografía (Opcional):</label>
          <input type="file" id="inpFile" accept="image/*">
        </div>
        <button type="submit" class="btn-save">Guardar Palabra</button>
      </form>

      <h3 style="margin-top: 25px; font-family: 'Fredoka', sans-serif; color: #2d3436;">Palabras Actuales:</h3>
      <div id="savedWordsList"></div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. MOTOR DE AUDIO
       ========================================================== */
    const AudioEngine = (() => {
      let isMuted = false;
      const synth = window.speechSynthesis;
      let mxVoice = null;

      function loadVoice() {
        if (!synth) return;
        const voices = synth.getVoices();
        mxVoice = voices.find(v => v.lang === 'es-MX') || voices.find(v => v.lang.startsWith('es')) || null;
      }
      if (synth) { loadVoice(); synth.onvoiceschanged = loadVoice; }

      // Reproduce exclusivamente tus audios en MP3 para cada letra
      function playLetter(char) {
        if (isMuted || !char) return;
        const letter = char.toLowerCase();
        const audio = new Audio(`audios/alfabeto-letra-${letter}.mp3`);
        audio.play().catch(err => {
          console.warn(`No se encontró el archivo: alfabeto-letra-${letter}.mp3`);
        });
      }

      // Deletreo secuencial usando tus audios de letras
      async function spellWord(letters, highlightFn) {
        if (isMuted) return;
        for (let i = 0; i < letters.length; i++) {
          highlightFn(i);
          playLetter(letters[i]);
          await new Promise(r => setTimeout(r, 1100));
        }
        highlightFn(-1);
      }

      // Lee la palabra completa de manera fluida y natural al presionar "Escuchar todo"
      function playFullWord(word) {
        if (isMuted || !word || !synth) return;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(word.toLowerCase());
        u.lang = 'es-MX';
        u.rate = 0.8; // Velocidad pausada y clara para niños
        if (mxVoice) u.voice = mxVoice;
        synth.speak(u);
      }

      return {
        toggleMute: () => { isMuted = !isMuted; if(isMuted && synth) synth.cancel(); return isMuted; },
        playLetter, 
        spellWord,
        playFullWord
      };
    })();

    /* ==========================================================
       2. BANCO DE PALABRAS
       ========================================================== */
    const Storage = (() => {
      const KEY = 'app_magica_palabras';
      const initial = [{ word: 'CASA', instruction: 'Forma una palabra de cuatro letras', img: '' }];

      return {
        get: () => {
          try {
            const data = localStorage.getItem(KEY);
            return data ? JSON.parse(data) : [...initial];
          } catch (e) { return [...initial]; }
        },
        set: (list) => localStorage.setItem(KEY, JSON.stringify(list))
      };
    })();

    /* ==========================================================
       3. LÓGICA DE LA INTERFAZ
       ========================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      let words = Storage.get();
      let currentIndex = 0;
      let activeIndex = 0;
      let userSlots = [];

      // DOM Elements
      const slotsContainer = document.getElementById('slotsContainer');
      const formedText = document.getElementById('formedText');
      const boxImg = document.getElementById('boxImg');
      const boxPlaceholder = document.getElementById('boxPlaceholder');
      const taskInstruction = document.getElementById('taskInstruction');
      const counter = document.getElementById('counter');
      const teacherModal = document.getElementById('teacherModal');
      
      // Teclado
      const layout = [
        ['Q','W','E','R','T','Y','U','I','O','P'],
        ['A','S','D','F','G','H','J','K','L','Ñ'],
        ['Z','X','C','V','B','N','M']
      ];

      function buildKeyboard() {
        const kbContainer = document.getElementById('keyboardRows');
        kbContainer.innerHTML = '';
        layout.forEach(row => {
          const div = document.createElement('div');
          div.className = 'kb-row';
          row.forEach(char => {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.textContent = char;
            btn.onclick = () => handleChar(char);
            div.appendChild(btn);
          });
          kbContainer.appendChild(div);
        });
      }

      function renderWord() {
        const current = words[currentIndex];
        counter.textContent = `${currentIndex + 1} / ${words.length}`;
        taskInstruction.textContent = current.instruction;

        if (current.img) {
          boxImg.src = current.img;
          boxImg.style.display = 'block';
          boxPlaceholder.style.display = 'none';
        } else {
          boxImg.style.display = 'none';
          boxPlaceholder.textContent = current.word;
          boxPlaceholder.style.display = 'block';
        }

        userSlots = new Array(current.word.length).fill('');
        activeIndex = 0;
        renderSlots();
        updateFormed();
      }

      function renderSlots() {
        slotsContainer.innerHTML = '';
        userSlots.forEach((char, i) => {
          const col = document.createElement('div');
          col.className = 'slot-col';
          
          const slot = document.createElement('div');
          slot.className = `letter-slot ${i === activeIndex ? 'active' : ''}`;
          slot.textContent = char;
          slot.onclick = () => { activeIndex = i; renderSlots(); if(char) AudioEngine.playLetter(char); };
          
          const btnListen = document.createElement('button');
          btnListen.className = 'btn-listen';
          btnListen.textContent = '🔊';
          btnListen.onclick = (e) => { e.stopPropagation(); AudioEngine.playLetter(userSlots[i] || words[currentIndex].word[i]); };
          
          col.appendChild(slot);
          col.appendChild(btnListen);
          slotsContainer.appendChild(col);
        });
      }

      function handleChar(char) {
        if (activeIndex < userSlots.length) {
          userSlots[activeIndex] = char;
          AudioEngine.playLetter(char);
          if (activeIndex < userSlots.length - 1) activeIndex++;
          renderSlots();
          updateFormed();
        }
      }

      function handleDel() {
        if (userSlots[activeIndex] !== '') userSlots[activeIndex] = '';
        else if (activeIndex > 0) { activeIndex--; userSlots[activeIndex] = ''; }
        renderSlots();
        updateFormed();
      }

      function updateFormed() { formedText.textContent = userSlots.map(c => c || '_').join(' '); }

      // Botones Principales
      document.getElementById('btnSound').onclick = (e) => {
        const isMuted = AudioEngine.toggleMute();
        e.target.textContent = isMuted ? 'Sonido: OFF' : 'Sonido: ON';
      };

      document.getElementById('btnPrev').onclick = () => { currentIndex = (currentIndex > 0) ? currentIndex - 1 : words.length - 1; renderWord(); };
      document.getElementById('btnNext').onclick = () => { currentIndex = (currentIndex < words.length - 1) ? currentIndex + 1 : 0; renderWord(); };
      document.getElementById('btnClear').onclick = () => { userSlots.fill(''); activeIndex = 0; renderSlots(); updateFormed(); };
      document.getElementById('btnBackspace').onclick = handleDel;

      document.getElementById('btnSpeak').onclick = () => {
        const textToPlay = userSlots.some(c => c !== '') ? userSlots.join('') : words[currentIndex].word;
        
        // Lee la palabra completa de corrido
        AudioEngine.playFullWord(textToPlay);
        
        // ¡Confeti si completó la palabra!
        if(userSlots.join('') === words[currentIndex].word) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      };

      document.getElementById('btnSpell').onclick = () => {
        const seq = (userSlots.some(c => c !== '') ? userSlots : words[currentIndex].word.split('')).filter(Boolean);
        AudioEngine.spellWord(seq, (idx) => {
          const items = slotsContainer.querySelectorAll('.letter-slot');
          items.forEach((item, i) => item.classList.toggle('active', i === idx));
        });
      };

      // Modal Docente
      document.getElementById('btnTeacher').onclick = () => { renderTeacherList(); teacherModal.style.display = 'flex'; };
      document.getElementById('btnCloseModal').onclick = () => { teacherModal.style.display = 'none'; };

      document.getElementById('addWordForm').onsubmit = (e) => {
        e.preventDefault();
        const w = document.getElementById('inpWord').value.trim().toUpperCase();
        const ins = document.getElementById('inpInstruction').value.trim();
        const file = document.getElementById('inpFile').files[0];

        const save = (imgStr) => {
          words.push({ word: w, instruction: ins, img: imgStr });
          Storage.set(words);
          e.target.reset();
          renderTeacherList();
          renderWord();
        };

        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => save(evt.target.result);
          reader.readAsDataURL(file);
        } else { save(''); }
      };

      function renderTeacherList() {
        const list = document.getElementById('savedWordsList');
        list.innerHTML = '';
        words.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'word-list-item';
          div.innerHTML = `
            <div>
              <strong style="font-family: 'Fredoka', sans-serif;">${item.word}</strong>
              <div style="font-size:0.8rem; color:#636e72;">${item.instruction}</div>
            </div>
            <button class="btn-delete">Eliminar</button>
          `;
          div.querySelector('button').onclick = () => {
            words.splice(idx, 1);
            if(words.length === 0) words.push({ word: 'CASA', instruction: 'Forma una palabra', img: '' });
            Storage.set(words);
            if(currentIndex >= words.length) currentIndex = 0;
            renderTeacherList();
            renderWord();
          };
          list.appendChild(div);
        });
      }

      // Iniciar
      buildKeyboard();
      renderWord();
    });
  </script>
</body>
</html>
